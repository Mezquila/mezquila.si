<title>HP Eder · El Padre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a phone you unlock. Lock screen → home screen of "apps" → full-screen app sheets. Phone frame on desktop, full-bleed on mobile. Single dark look: black always (Padre Azul CI). */
:root{
  --ink:#000;
  --ink-2:#0d0f12;
  --bone:#f2eee6;
  --bone-dim:rgba(242,238,230,.62);
  --bone-faint:rgba(242,238,230,.12);
  --yellow:#ffe600;
  --red:#d92027;
  --agave:#3b6ea8;
  --cyan:#00aeef;
  --orange:#e2703a;
  --glass:rgba(22,24,28,.72);
  --f-display:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  --f-hand:"Caveat Brush","Bradley Hand","Segoe Print",cursive;
  --f-body:"Noto Serif","Droid Serif",Georgia,serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px;border-radius:8px}

/* stage + phone */
.stage{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.backdrop{position:absolute;inset:0;display:none;pointer-events:none;overflow:hidden}
.backdrop span{position:absolute;font-family:var(--f-display);color:var(--bone-faint);white-space:nowrap;line-height:.9}
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink);isolation:isolate}
@media (min-width:720px) and (min-height:700px){
  .backdrop{display:block}
  .phone{width:390px;height:min(844px,calc(100% - 48px));border-radius:56px;box-shadow:0 0 0 11px #15171b,0 0 0 12px #2a2d33,0 40px 120px rgba(59,110,168,.35)}
  .phone::after{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:50}
}

/* shared screen pieces */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(20px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(20px,env(safe-area-inset-left,0px))}
canvas.spray{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.status{display:flex;justify-content:space-between;align-items:center;height:54px;flex:none;font-size:15px;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.status .right{display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1px solid var(--bone-faint);border-radius:99px;overflow:hidden;font-size:11px;letter-spacing:.08em}
.lang button{padding:4px 9px;color:var(--bone-dim)}
.lang button[aria-pressed="true"]{background:var(--bone);color:var(--ink)}

/* lock screen */
#lock{z-index:20;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s;touch-action:none;user-select:none;background:var(--ink)}
#lock.gone{transform:translateY(-105%);opacity:.2;pointer-events:none}
.lock-top{display:flex;flex-direction:column;align-items:center;margin-top:8px}
.lock-date{font-size:17px;font-weight:600;color:var(--bone-dim)}
.lock-clock{font-family:var(--f-display);font-size:clamp(84px,26vw,104px);line-height:1;margin-top:2px;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(59,110,168,.55)}
.lock-tag{font-family:var(--f-hand);font-size:22px;color:var(--yellow);margin-top:4px;text-align:center}
.skull{width:min(40%,150px);height:auto;aspect-ratio:369/520;margin:14px auto 0;display:block;filter:drop-shadow(0 0 22px rgba(0,174,239,.25))}
.ramon{text-align:center;font-family:var(--f-hand);font-size:18px;color:var(--bone-dim);margin-top:6px;letter-spacing:.04em}
.notes{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.note{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;padding:12px 14px;display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center}
.note .ic{grid-row:span 2;width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.note b{font-size:13px;letter-spacing:.02em}
.note time{font-size:12px;color:var(--bone-dim)}
.note p{grid-column:2 / 4;margin:0;font-size:14px;line-height:1.35}
.unlock{margin:16px auto 10px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--bone-dim);font-size:14px}
.unlock .chev{animation:nudge 1.8s ease-in-out infinite}
.unlock .bar{width:134px;height:5px;border-radius:3px;background:var(--bone)}
@keyframes nudge{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}

/* home */
#home{z-index:10;background:var(--ink)}
.widget{margin-top:6px;border-radius:26px;padding:16px 18px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.widget .day{font-size:13px;font-weight:700;color:var(--red);letter-spacing:.06em}
.widget .num{font-family:var(--f-display);font-size:46px;line-height:1}
.widget .who{grid-row:1 / 3;grid-column:2;min-width:0}
.widget h1{font-family:var(--f-display);font-weight:400;font-size:27px;margin:0;line-height:1.05}
.widget .role{font-family:var(--f-hand);font-size:19px;color:var(--yellow);margin-top:2px}
.widget .route{font-size:12px;color:var(--bone-dim);margin-top:6px;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;margin-top:26px;justify-items:center}
.app-btn{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;font-size:12px;color:var(--bone)}
.icon{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;transition:transform .15s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.app-btn:active .icon{transform:scale(.9)}
.icon svg{width:36px;height:36px}
.mantra{margin-top:auto;text-align:center;font-family:var(--f-hand);font-size:21px;color:var(--bone-dim);padding:0 10px}
.dock{margin:14px -4px 10px;padding:12px 18px;border-radius:30px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;justify-content:space-around}
.dock .app-btn > span:not(.icon){display:none}
.homebar{width:134px;height:5px;border-radius:3px;background:var(--bone);margin:0 auto 8px;flex:none}

/* app sheet */
#sheet{z-index:30;background:var(--ink-2);transform:translateY(102%);transition:transform .42s cubic-bezier(.2,.8,.2,1);padding-left:0;padding-right:0}
#sheet.open{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));flex:none;border-bottom:1px solid var(--bone-faint)}
.back{display:flex;align-items:center;gap:4px;color:var(--yellow);font-size:16px;padding:6px 0}
.sheet-head .t{font-weight:600;font-size:16px}
.sheet-head .sp{width:64px}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px max(22px,env(safe-area-inset-right,0px)) 40px max(22px,env(safe-area-inset-left,0px))}
.sheet-body h2{font-family:var(--f-display);font-weight:400;font-size:38px;line-height:1.02;margin:0 0 14px;text-wrap:balance}
.sheet-body h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:26px 0 6px}
.sheet-body p{font-family:var(--f-body);font-size:16.5px;line-height:1.6;margin:0 0 14px;max-width:62ch}
.sheet-body .hand{font-family:var(--f-hand);font-size:26px;line-height:1.2;color:var(--yellow)}
.sheet-body .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);margin-bottom:10px}
.sheet-body .big{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--bone);margin:24px 0;text-wrap:balance}
.brush{display:inline;background:linear-gradient(transparent 58%,rgba(217,32,39,.85) 58%,rgba(217,32,39,.85) 90%,transparent 90%);padding:0 2px}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--bone-faint);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-dim)}
.homebar-btn{display:block;width:100%;padding:10px 0 8px;flex:none}

/* brands */
.brands{display:grid;gap:18px}
.brand{margin:0;border-radius:22px;overflow:hidden;background:#15181d}
.brand img{display:block;width:100%;height:auto;max-width:100%}
.brand figcaption{padding:14px 16px 16px}
.brand h4{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}
.brand .kind{font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:2px 0 6px}
.brand p{font-size:14.5px;margin:0;line-height:1.45}

/* ritual */
.steps{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:baseline;font-family:var(--f-body);font-size:16px;line-height:1.5}
.steps li::before{content:counter(s);font-family:var(--f-display);font-size:24px;color:var(--yellow)}
.pour{display:flex;flex-direction:column;align-items:center;gap:14px;margin:26px 0 8px}
.pour svg{width:110px;height:140px}
#liquid{transform-origin:50% 100%;transform:scaleY(0);transition:transform 1.6s cubic-bezier(.4,.1,.2,1)}
.poured #liquid{transform:scaleY(1)}
.pour-btn{background:var(--yellow);color:var(--ink);font-family:var(--f-display);font-size:20px;padding:10px 28px;border-radius:99px}
.salud{font-family:var(--f-hand);font-size:28px;color:var(--yellow);min-height:36px;opacity:0;transition:opacity .6s 1.3s;text-align:center}
.poured .salud{opacity:1}

/* thinking */
.rules{display:grid;gap:12px}
.rule{padding:14px 16px;border-radius:16px;background:#15181d}
.rule b{font-family:var(--f-display);font-weight:400;font-size:21px;display:block;margin-bottom:4px;color:var(--cyan)}
.rule p{margin:0;font-size:15px}

/* contact */
.links{display:grid;gap:10px;margin-top:8px}
.link{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:#15181d;text-decoration:none}
.link .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.link b{display:block;font-size:15px}
.link span{font-size:13px;color:var(--bone-dim)}
.link .go{color:var(--yellow);font-size:13px}
.copy{color:var(--yellow);font-size:13px;padding:6px 8px}

/* essays */
.elist{display:grid;gap:0;margin-top:4px}
.eitem{display:block;width:100%;text-align:left;padding:18px 0;border-bottom:1px solid var(--bone-faint)}
.eitem:first-child{border-top:1px solid var(--bone-faint)}
.eitem .meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-dim);font-variant-numeric:tabular-nums}
.eitem h3{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05;margin:6px 0 6px;color:var(--bone);text-wrap:balance}
.eitem p{font-family:var(--f-body);font-size:15px;line-height:1.5;color:var(--bone-dim);margin:0}
.eitem .more{display:inline-block;margin-top:8px;font-size:13px;color:var(--orange)}
.essay .meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:10px;font-variant-numeric:tabular-nums}
.essay h2{font-size:42px}
.essay .lede{font-family:var(--f-body);font-style:italic;color:var(--bone-dim);font-size:17px}
.essay h3{color:var(--yellow)}
.essay blockquote{margin:22px 0;padding:0 0 0 16px;border-left:3px solid var(--red);font-family:var(--f-display);font-size:27px;line-height:1.15;color:var(--bone);text-wrap:balance}
.essay ul{margin:0 0 14px;padding-left:20px;font-family:var(--f-body);font-size:16.5px;line-height:1.55}
.essay li{margin-bottom:8px}
.essay .sig{font-family:var(--f-hand);font-size:24px;color:var(--yellow);margin-top:20px}
.enav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.enav button{font-size:14px;color:var(--yellow);text-align:left;max-width:48%}
.enav button:last-child{text-align:right;margin-left:auto}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>

</head>

{id:"memento-vivere",date:"2026-11-20",tequila:true,
 en:{t:"Memento vivere",teaser:"Why there is a skull on our bottle, and what an Austrian learned about time at a table in Mexico.",body:[
 "I grew up in Rauris, in the Salzburg mountains. Up there, time is measured in seasons and in work. You get up early. You finish what you started. Rest comes later.",
 "Then I went to Mexico.",
 "The first thing I noticed was how people there treat time. Time with family and friends comes first. A lunch can run for hours and nobody checks the clock. Everything else waits.",
 "For a while I read it as inefficiency. I was wrong.",
 "I understood it the first time I was introduced to Adriana's family. That evening I saw what the long lunches were for. The table was the point. The people around it were the point.",
 "That is the culture tequila carries for me. A drink you share slowly, with the people you love.",
 "> Give your time to the people you love. While you still have them.",
 "## The skull",
 "People ask why a tequila brand puts a skull on its bottle. Death sells badly, they say.",
 "The skull is the oldest reminder we have. The Latin phrase is memento mori: remember that you will die. We turned it around. Memento vivere. Remember that you live.",
 "The skull says one thing: your time is limited. So the only sensible answer is to spend it now. With your people. At the table. Before the next quarter, the next promotion, the next house.",
 "That is why our ritual starts with the cap. You lift the skull off the bottle and look it in the eye. Then you pour. For your people first, for yourself last.",
 "Thirty seconds. A small act that makes the moment count.",
 "## What I am building",
 "Padre Azul is a tequila company. It is also my answer to a question I brought back from Mexico: what are you saving your time for?",
 "I don't have a perfect answer. I have a ritual.",
 "Look death in the eye. Then pour."]},
 de:{t:"Memento vivere",teaser:"Warum ein Totenkopf auf unserer Flasche sitzt und was ein Österreicher an einem Tisch in Mexiko über Zeit gelernt hat.",body:[
 "Ich bin in Rauris aufgewachsen, in den Salzburger Bergen. Dort misst man Zeit in Jahreszeiten und in Arbeit. Man steht früh auf. Man bringt zu Ende, was man angefangen hat. Ausruhen kommt später.",
 "Dann bin ich nach Mexiko gegangen.",
 "Als Erstes ist mir aufgefallen, wie die Menschen dort mit Zeit umgehen. Zeit mit Familie und Freunden kommt zuerst. Ein Mittagessen dauert Stunden, und niemand schaut auf die Uhr. Alles andere wartet.",
 "Eine Weile habe ich das für Ineffizienz gehalten. Ich lag falsch.",
 "Verstanden habe ich es, als ich zum ersten Mal Adrianas Familie vorgestellt wurde. An diesem Abend habe ich gesehen, wofür die langen Mittagessen da sind. Der Tisch war der Sinn. Die Menschen daran waren der Sinn.",
 "Genau diese Kultur trägt Tequila für mich. Ein Drink, den man langsam teilt, mit den Menschen, die man liebt.",
 "> Schenk deine Zeit den Menschen, die du liebst. Solange du sie noch hast.",
 "## Der Totenkopf",
 "Man fragt mich, warum eine Tequila-Marke einen Totenkopf auf die Flasche setzt. Tod verkauft sich schlecht, heißt es.",
 "Der Totenkopf ist die älteste Erinnerung, die wir haben. Auf Latein heißt sie memento mori: Denk daran, dass du sterben wirst. Wir haben sie umgedreht. Memento vivere. Denk daran, dass du lebst.",
 "Der Totenkopf sagt nur eines: Deine Zeit ist begrenzt. Die einzig vernünftige Antwort ist, sie jetzt zu verbringen. Mit deinen Leuten. Am Tisch. Vor dem nächsten Quartal, der nächsten Beförderung, dem nächsten Haus.",
 "Deshalb beginnt unser Ritual mit dem Verschluss. Du nimmst den Totenkopf von der Flasche und schaust ihm in die Augen. Dann schenkst du ein. Zuerst deinen Leuten, dir selbst zuletzt.",
 "Dreißig Sekunden. Eine kleine Geste, die den Moment zählen lässt.",
 "## Was ich baue",
 "Padre Azul ist eine Tequila-Firma. Sie ist auch meine Antwort auf eine Frage, die ich aus Mexiko mitgebracht habe: Wofür sparst du deine Zeit auf?",
 "Ich habe keine perfekte Antwort. Ich habe ein Ritual.",
 "Schau dem Tod in die Augen. Dann schenk ein."]}},

{id:"the-14th-tee",date:"2026-11-20",
 en:{t:"The 14th tee",teaser:"Golf is four hours of decisions with long gaps in between. The gaps tell you more than the score.",body:[
 "Golf is four hours of decisions with long gaps in between. Dozens of separate shots. Every result is unambiguous: the ball is in the fairway or it isn't.",
 "The gaps are the dangerous part. The mind fills them.",
 "Tim Gallwey put it in one line in The Inner Game of Golf: performance equals potential minus interference. You rarely play badly because you lack the skill. You play badly because something in your head is in the way.",
 "I recognise every one of those interferences. And I recognise them off the course.",
 "- Three swing thoughts at address. At work that is over-preparing instead of acting.",
 "- Playing the scorecard three holes ahead. That is what-if catastrophising.",
 "- Trying to win back a double bogey with one heroic shot. That is trying to rescue a bad quarter with one big deal.",
 "- Gripping tighter under pressure. That happens everywhere.",
 "> If a pattern shows up on the 14th tee, it is not a golf pattern.",
 "## Shrink the target",
 "Gio Valiante coaches PGA Tour players and hedge fund managers with the same protocol. A golfer in a slump and a portfolio manager in a drawdown behave alike. They see threat instead of opportunity. They try to recover everything in one swing. They lose access to the ability they already have.",
 "His answer is simple: make the target smaller until winning is likely again. Small wins rebuild confidence faster than big plans.",
 "That is what I take into sales. When things go badly, the next target gets smaller. One bar. One owner. One table.",
 "Golf doesn't let you hide. That is why I keep playing.",
 "Shrink the target. Then swing."]},
 de:{t:"Der 14. Abschlag",teaser:"Golf sind vier Stunden voller Entscheidungen mit langen Pausen dazwischen. Die Pausen verraten mehr als die Scorekarte.",body:[
 "Golf sind vier Stunden voller Entscheidungen mit langen Pausen dazwischen. Dutzende einzelne Schläge. Jedes Ergebnis ist eindeutig: Der Ball liegt auf dem Fairway oder nicht.",
 "Die Pausen sind der gefährliche Teil. Der Kopf füllt sie.",
 "Tim Gallwey hat es in The Inner Game of Golf in eine Zeile gepackt: Leistung ist Potenzial minus Störung. Man spielt selten schlecht, weil das Können fehlt. Man spielt schlecht, weil einem etwas im Kopf im Weg steht.",
 "Ich kenne jede dieser Störungen. Und ich kenne sie auch abseits des Platzes.",
 "- Drei Schwunggedanken beim Ansprechen. Im Büro heißt das: überplanen statt handeln.",
 "- Die Scorekarte drei Löcher im Voraus spielen. Das ist Was-wäre-wenn-Katastrophendenken.",
 "- Ein Doppelbogey mit einem Heldenschlag zurückholen wollen. Das ist der Versuch, ein schlechtes Quartal mit einem großen Deal zu retten.",
 "- Unter Druck fester zugreifen. Das passiert überall.",
 "> Wenn ein Muster am 14. Abschlag auftaucht, ist es kein Golfmuster.",
 "## Das Ziel verkleinern",
 "Gio Valiante coacht PGA-Tour-Spieler und Hedgefonds-Manager mit demselben Protokoll. Ein Golfer in der Krise und ein Portfoliomanager im Drawdown verhalten sich gleich. Sie sehen Bedrohung statt Chance. Sie wollen alles mit einem Schwung zurückholen. Sie verlieren den Zugang zu dem, was sie längst können.",
 "Seine Antwort ist einfach: das Ziel so lange verkleinern, bis Gewinnen wieder wahrscheinlich ist. Kleine Siege bauen Selbstvertrauen schneller auf als große Pläne.",
 "Das nehme ich in den Vertrieb mit. Wenn es schlecht läuft, wird das nächste Ziel kleiner. Eine Bar. Ein Wirt. Ein Tisch.",
 "Golf lässt dich nicht verstecken. Deshalb spiele ich weiter.",
 "Ziel verkleinern. Dann schwingen."]}},

{id:"retirement-is-not-an-age",date:"2026-11-20",tequila:true,
 en:{t:"Retirement is not an age",teaser:"Naval's definition, the trap of deferred living, and why the people at the table come first.",body:[
 "Naval Ravikant defined retirement in a way I can't forget. Retirement is the moment you stop sacrificing today for an imaginary tomorrow. When what you do today is complete in itself.",
 "By that definition, most people never retire. Including many who stop working.",
 "We build our lives around a future payoff. Work a job you tolerate for thirty years, then live. Delay the health, the relationships, the trip, the long lunch. Sacrifice the present for a future self who may never arrive.",
 "I know this pattern well. Building a company invites it. There is always one more market, one more round, one more launch before you can breathe.",
 "## The right order",
 "Naval adds an order, and I think he is right. First the material foundation. Then health. Then the inner work. Nobody finds peace while worrying about rent. So ambition is fine. The question is what it serves.",
 "Tim Ferriss gave me the other half. After twenty years of self-optimisation he arrived at a simple conclusion: it's the relationships. He calls it Maslow's hamburger. Health, money and status are the bread. The meat in the middle, the reason for the whole thing, is the people around you.",
 "> The bread matters. Nobody orders a burger for the bun.",
 "## A test for the calendar",
 "So I run a small test on my week: does this make my relationships better? A dinner cooked for friends. A call I keep postponing. A table with the people I love and a bottle in the middle.",
 "This is also why I do what I do. A tequila brand is a small thing. It lives exactly where life happens: at the table, between people, in time you chose to give them.",
 "You don't have to wait for a certain age. You can retire tonight, for one evening, at one table."]},
 de:{t:"Ruhestand ist kein Alter",teaser:"Navals Definition, die Falle des aufgeschobenen Lebens und warum die Menschen am Tisch zuerst kommen.",body:[
 "Naval Ravikant hat Ruhestand so definiert, dass ich es nicht mehr vergesse. Ruhestand ist der Moment, in dem du aufhörst, das Heute für ein eingebildetes Morgen zu opfern. Wenn das, was du heute tust, in sich vollständig ist.",
 "Nach dieser Definition gehen die meisten Menschen nie in Ruhestand. Auch viele nicht, die aufhören zu arbeiten.",
 "Wir bauen unser Leben um eine Belohnung in der Zukunft. Dreißig Jahre einen Job aushalten, dann leben. Gesundheit, Beziehungen, die Reise, das lange Mittagessen verschieben. Die Gegenwart opfern für ein zukünftiges Ich, das vielleicht nie ankommt.",
 "Ich kenne dieses Muster gut. Wer eine Firma aufbaut, lädt es ein. Es gibt immer noch einen Markt, noch eine Runde, noch einen Launch, bevor man durchatmen darf.",
 "## Die richtige Reihenfolge",
 "Naval gibt eine Reihenfolge vor, und ich halte sie für richtig. Zuerst das materielle Fundament. Dann die Gesundheit. Dann die innere Arbeit. Niemand findet Frieden, solange er sich um die Miete sorgt. Ehrgeiz ist also in Ordnung. Die Frage ist, wem er dient.",
 "Tim Ferriss hat mir die andere Hälfte gegeben. Nach zwanzig Jahren Selbstoptimierung kam er zu einem einfachen Schluss: Es sind die Beziehungen. Er nennt es Maslows Hamburger. Gesundheit, Geld und Status sind das Brot. Das Fleisch in der Mitte, der Grund für das Ganze, sind die Menschen um dich herum.",
 "> Das Brot ist wichtig. Niemand bestellt einen Burger wegen des Brötchens.",
 "## Ein Test für den Kalender",
 "Also mache ich mit meiner Woche einen kleinen Test: Macht das meine Beziehungen besser? Ein Abendessen, für Freunde gekocht. Ein Anruf, den ich ständig verschiebe. Ein Tisch mit den Menschen, die ich liebe, und eine Flasche in der Mitte.",
 "Deshalb mache ich auch, was ich mache. Eine Tequila-Marke ist eine kleine Sache. Sie lebt genau dort, wo das Leben passiert: am Tisch, zwischen Menschen, in Zeit, die man ihnen bewusst schenkt.",
 "Du musst nicht auf ein bestimmtes Alter warten. Du kannst heute Abend in Ruhestand gehen, für einen Abend, an einem Tisch."]}}
];

 about:{
  en:{t:"About",h:`<div class="eyebrow">Notes · HP Eder</div>
<h2>Hi. I'm HP. They call me <span class="brush">El Padre</span>.</h2>
<p>I co-founded Padre Azul, a super-premium tequila with an Austrian-Mexican story. I lead sales and marketing, and everything that ties us to Mexico.</p>
<p>I grew up in Rauris, a valley in the Salzburg mountains. Today I live between Salzburg and Tirol. Padre Azul is based in Wattens.</p>
<p>Our house has three brands: Padre Azul, Padrecito and Xiaman.</p>
<p>I speak German, Spanish and English. Every morning I write a short numbered note for LinkedIn and X. One idea per note.</p>
<p class="hand">On Instagram I'm @mezquila.</p>`},
  de:{t:"Über mich",h:`<div class="eyebrow">Notizen · HP Eder</div>
<h2>Servus. Ich bin HP. Man nennt mich <span class="brush">El Padre</span>.</h2>
<p>Ich habe Padre Azul mitgegründet, einen Super-Premium-Tequila mit österreichisch-mexikanischer Geschichte. Ich verantworte Vertrieb und Marketing und alles, was uns mit Mexiko verbindet.</p>
<p>Aufgewachsen bin ich in Rauris, in den Salzburger Bergen. Heute lebe ich zwischen Salzburg und Tirol. Padre Azul sitzt in Wattens.</p>
<p>Unser Haus hat drei Marken: Padre Azul, Padrecito und Xiaman.</p>
<p>Ich spreche Deutsch, Spanisch und Englisch. Jeden Morgen schreibe ich eine kurze, nummerierte Notiz für LinkedIn und X. Ein Gedanke pro Notiz.</p>
<p class="hand">Auf Instagram bin ich @mezquila.</p>`}

 why:{
  en:{t:"Why",h:`<div class="eyebrow">Founder manifesto</div>
<h2>Time is the only thing we pour.</h2>
<p>As an Austrian in Mexico, I noticed how people there treat time. Time with family and friends comes first. Everything else can wait.</p>
<p>I understood it the first time I was introduced to Adriana's family. Adriana is my partner and co-founder. She is from Jalisco.</p>
<p>For me, tequila carries that culture. So we built a brand around one reminder.</p>
<div class="big">Give your time to the people you love. While you still have them.</div>
<p>The skull on our bottle is permission to live now. Memento vivere.</p>
<p class="hand">Love. Time. Eternal friendship.</p>`},
  de:{t:"Warum",h:`<div class="eyebrow">Gründer-Manifest</div>
<h2>Zeit ist das Einzige, was wir wirklich einschenken.</h2>
<p>Als Österreicher in Mexiko habe ich gesehen, wie die Menschen dort mit Zeit umgehen. Zeit mit Familie und Freunden kommt zuerst. Alles andere kann warten.</p>
<p>Verstanden habe ich es, als ich zum ersten Mal Adrianas Familie vorgestellt wurde. Adriana ist meine Partnerin und Mitgründerin. Sie kommt aus Jalisco.</p>
<p>Für mich trägt Tequila genau diese Kultur. Also haben wir eine Marke um eine einzige Erinnerung gebaut.</p>
<div class="big">Schenk deine Zeit den Menschen, die du liebst. Solange du sie noch hast.</div>
<p>Der Totenkopf auf unserer Flasche ist die Erlaubnis, jetzt zu leben. Memento vivere.</p>
<p class="hand">Liebe. Zeit. Ewige Freundschaft.</p>`}

 thinking:{
  en:{t:"Thinking",h:`<div class="eyebrow">How I work</div>
<h2>A few rules I keep.</h2>
<div class="rules">
 <div class="rule"><b>Invert, always invert.</b><p>Charlie Munger's rule. Ask what would make it fail, then avoid that.</p></div>
 <div class="rule"><b>Counterargument first.</b><p>Before I believe an idea, I look for the strongest case against it.</p></div>
 <div class="rule"><b>Say the confidence out loud.</b><p>Seventy percent sure is useful. Pretending to be a hundred is not.</p></div>
 <div class="rule"><b>Prioritise brutally.</b><p>Two priorities. Everything else waits or gets killed.</p></div>
 <div class="rule"><b>People in the middle.</b><p>Health, money and work are the bread. The relationships are the meal.</p></div>
</div>`},
  de:{t:"Denken",h:`<div class="eyebrow">Wie ich arbeite</div>
<h2>Ein paar Regeln, an die ich mich halte.</h2>
<div class="rules">
 <div class="rule"><b>Umdrehen. Immer umdrehen.</b><p>Charlie Mungers Regel. Frag, was es scheitern lässt, und vermeide genau das.</p></div>
 <div class="rule"><b>Gegenargument zuerst.</b><p>Bevor ich einer Idee glaube, suche ich das stärkste Argument dagegen.</p></div>
 <div class="rule"><b>Sicherheit aussprechen.</b><p>Siebzig Prozent sicher ist hilfreich. So zu tun, als wären es hundert, nicht.</p></div>
 <div class="rule"><b>Brutal priorisieren.</b><p>Zwei Prioritäten. Alles andere wartet oder fliegt raus.</p></div>
 <div class="rule"><b>Menschen in die Mitte.</b><p>Gesundheit, Geld und Arbeit sind das Brot. Die Beziehungen sind das Essen.</p></div>
</div>`}

 golf:{
  en:{t:"Golf",h:`<div class="eyebrow">Long game</div>
<h2>Golf is a mirror.</h2>
<p>Four hours, dozens of separate shots, and long gaps in between for the mind to fill. Every result is unambiguous.</p>
<div class="big">If a pattern shows up on the 14th tee, it is not a golf pattern.</div>
<p>Three swing thoughts at address look a lot like over-preparing at work. Trying to win back a double bogey in one swing looks a lot like trying to win back a bad quarter in one deal.</p>
<p class="hand">Shrink the target. Then swing.</p>`},
  de:{t:"Golf",h:`<div class="eyebrow">Das lange Spiel</div>
<h2>Golf ist ein Spiegel.</h2>
<p>Vier Stunden, dutzende einzelne Schläge und lange Pausen dazwischen, die der Kopf füllt. Jedes Ergebnis ist eindeutig.</p>
<div class="big">Wenn ein Muster am 14. Abschlag auftaucht, ist es kein Golfmuster.</div>
<p>Drei Schwunggedanken beim Ansprechen sehen aus wie Überplanung im Büro. Ein Doppelbogey mit einem Schlag zurückholen wollen sieht aus wie ein schlechtes Quartal mit einem Deal retten wollen.</p>
<p class="hand">Ziel verkleinern. Dann schwingen.</p>`}

  de:{t:"Kontakt",h:`<div class="eyebrow">Salzburg · Tirol · Österreich</div>
<h2>Lass uns reden. Oder besser: einschenken.</h2>
<p>Für Partnerschaften, Distribution oder ein gutes Gespräch erreichst du mich hier.</p>
${links("Öffnen")}`}
 }
};

function bottle(img,name,kind,text,col){
 return `<figure class="brand"><img src="${IMG[img]}" alt="${name} bottle" loading="lazy"><figcaption><h4>${name}</h4><div class="kind" style="color:${col}">${kind}</div><p>${text}</p></figcaption></figure>`;
}
function pour(a,b,salud){
 return `<div class="pour" id="pourBox"><svg viewBox="0 0 110 140" aria-hidden="true">
  <clipPath id="gl"><path d="M22 20h66l-8 104a8 8 0 0 1-8 7H38a8 8 0 0 1-8-7z"/></clipPath>
  <g clip-path="url(#gl)"><rect id="liquid" x="0" y="44" width="110" height="96" fill="#ffe600" fill-opacity=".9"/></g>
  <path d="M22 20h66l-8 104a8 8 0 0 1-8 7H38a8 8 0 0 1-8-7z" fill="none" stroke="#f2eee6" stroke-width="3" filter="url(#rough)"/>
 </svg><button class="pour-btn" id="pourBtn" data-a="${a}" data-b="${b}">${a}</button><div class="salud">${salud}</div></div>`;
}
function links(open){
 return `<div class="links">
  <div class="link"><span class="ic" style="background:linear-gradient(135deg,var(--yellow),var(--red) 60%,#7a1a6b)"><svg viewBox="0 0 36 36" width="26" height="26"><rect x="7" y="7" width="22" height="22" rx="7" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="18" cy="18" r="5.2" fill="none" stroke="#fff" stroke-width="2.6"/></svg></span>
   <div><b>Instagram</b><span>@mezquila</span></div>
   <a class="go" href="https://www.instagram.com/mezquila/" target="_blank" rel="noopener">${open} ↗</a></div>
  <div class="link"><span class="ic" style="background:var(--agave);font:700 18px Arial,sans-serif">in</span>
   <div><b>LinkedIn</b><span>linkedin.com/in/hpeder</span></div>
   <a class="go" href="https://www.linkedin.com/in/hpeder/" target="_blank" rel="noopener">${open} ↗</a></div>
 </div>`;
}

let lang="en";
try{const s=localStorage.getItem("hp-lang");if(s==="en"||s==="de")lang=s;else if((navigator.language||"").toLowerCase().startsWith("de"))lang="de";}catch(e){if((navigator.language||"").toLowerCase().startsWith("de"))lang="de";}
let current=null;

function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-t]").forEach(el=>{const v=T[lang][el.dataset.t];if(v!=null)el.textContent=v;});
 document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
 tick();
 if(current)render(current);
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();lang=b.dataset.lang;try{localStorage.setItem("hp-lang",lang)}catch(_){}applyLang();}));

/* clock: Vienna time */
function tick(){
 const now=new Date(),loc=T[lang].locale,tz="Europe/Vienna";
 const hm=new Intl.DateTimeFormat(loc,{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:tz}).format(now);
 document.getElementById("lockClock").textContent=hm;
 document.getElementById("homeClock").textContent=hm;
 document.getElementById("sheetClock").textContent=hm;
 document.getElementById("lockDate").textContent=new Intl.DateTimeFormat(loc,{weekday:"long",day:"numeric",month:"long",timeZone:tz}).format(now);
 document.getElementById("wDay").textContent=new Intl.DateTimeFormat(loc,{weekday:"short",timeZone:tz}).format(now).replace(".","").toUpperCase();
 document.getElementById("wNum").textContent=new Intl.DateTimeFormat(loc,{day:"numeric",timeZone:tz}).format(now).replace(".","");
}
setInterval(tick,10000);

/* spray-paint wallpaper */
function spray(c){
 const r=c.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
 if(!r.width)return;
 c.width=r.width*dpr;c.height=r.height*dpr;
 const x=c.getContext("2d");x.scale(dpr,dpr);x.clearRect(0,0,r.width,r.height);
 let s=+c.dataset.seed||1;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 const g=x.createRadialGradient(r.width*.5,r.height*.38,10,r.width*.5,r.height*.38,r.width*.9);
 g.addColorStop(0,"rgba(59,110,168,.22)");g.addColorStop(1,"rgba(0,0,0,0)");
 x.fillStyle=g;x.fillRect(0,0,r.width,r.height);
 const blobs=[["59,110,168",.12,.18],["217,32,39",.88,.62],["255,230,0",.2,.86],["0,174,239",.8,.12]];
 blobs.forEach(([col,bx,by])=>{
  const cx=bx*r.width,cy=by*r.height;
  for(let i=0;i<900;i++){
   const a=rnd()*Math.PI*2,d=Math.pow(rnd(),1.8)*r.width*.42;
   x.fillStyle=`rgba(${col},${(.35*(1-d/(r.width*.42))).toFixed(3)})`;
   x.beginPath();x.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d,rnd()*1.4+.3,0,7);x.fill();
  }
 });
}
const paint=()=>document.querySelectorAll("canvas.spray").forEach(spray);
window.addEventListener("resize",paint);

/* lock / unlock */
const lock=document.getElementById("lock");
function unlock(){lock.classList.add("gone");lock.style.transform="";lock.setAttribute("aria-hidden","true");}
function relock(){closeApp(true);lock.classList.remove("gone");lock.removeAttribute("aria-hidden");}
document.getElementById("unlockBtn").addEventListener("click",unlock);
document.getElementById("relock").addEventListener("click",relock);
let y0=null,dy=0;
lock.addEventListener("pointerdown",e=>{if(e.target.closest(".lang"))return;y0=e.clientY;dy=0;lock.style.transition="none";});
window.addEventListener("pointermove",e=>{if(y0==null)return;dy=Math.min(0,e.clientY-y0);lock.style.transform=`translateY(${dy}px)`;});
window.addEventListener("pointerup",()=>{if(y0==null)return;lock.style.transition="";const far=dy<-90;y0=null;if(far)unlock();else lock.style.transform="";});
window.addEventListener("keydown",e=>{
 if(!lock.classList.contains("gone")&&(e.key==="ArrowUp"||e.key===" "||e.key==="Enter")&&!e.target.closest("button")){e.preventDefault();unlock();}
 if(e.key==="Escape"&&current)closeApp();
});

/* apps */
const sheet=document.getElementById("sheet"),body=document.getElementById("sheetBody");
let essayId=null;
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const mins=e=>Math.max(1,Math.ceil(e.body.join(" ").split(/\s+/).length/200));
const fdate=d=>new Intl.DateTimeFormat(T[lang].locale,{day:"numeric",month:"long",year:"numeric"}).format(new Date(d+"T12:00:00"));
function essayBody(lines){
 let out="",ul=false;
 lines.forEach(l=>{
  if(l.startsWith("- ")){if(!ul){out+="<ul>";ul=true;}out+="<li>"+esc(l.slice(2))+"</li>";return;}
  if(ul){out+="</ul>";ul=false;}
  if(l.startsWith("## "))out+="<h3>"+esc(l.slice(3))+"</h3>";
  else if(l.startsWith("> "))out+="<blockquote>"+esc(l.slice(2))+"</blockquote>";
  else out+="<p>"+esc(l)+"</p>";
 });
 if(ul)out+="</ul>";return out;
}
function renderEssays(){
 const L=T[lang],title=document.getElementById("sheetTitle"),bl=document.querySelector("#backBtn [data-t]");
 if(essayId){
  const i=ESSAYS.findIndex(x=>x.id===essayId),e=ESSAYS[i],c=e[lang];
  title.textContent=c.t;bl.textContent=L.ess_back;
  const prev=ESSAYS[i-1],next=ESSAYS[i+1];
  body.innerHTML=`<article class="essay"><div class="meta">${fdate(e.date)} · ${mins(c)} ${L.ess_min}</div><h2>${esc(c.t)}</h2><p class="lede">${esc(c.teaser)}</p>${essayBody(c.body)}<div class="sig">HP</div>${e.tequila?`<div class="foot">${lang==="de"?"Bitte verantwortungsvoll genießen.":"Drink responsibly."}</div>`:""}<nav class="enav">${prev?`<button data-essay="${prev.id}">← ${esc(prev[lang].t)}</button>`:""}${next?`<button data-essay="${next.id}">${esc(next[lang].t)} →</button>`:""}</nav></article>`;
 }else{
  title.textContent=L.ess_t;bl.textContent=L.home;
  body.innerHTML=`<div class="eyebrow">${L.ess_eye}</div><h2>${L.ess_h}</h2><div class="elist">${ESSAYS.map(e=>{const c=e[lang];return `<button class="eitem" data-essay="${e.id}"><div class="meta">${fdate(e.date)} · ${mins(c)} ${L.ess_min}</div><h3>${esc(c.t)}</h3><p>${esc(c.teaser)}</p><span class="more">${L.ess_read} →</span></button>`}).join("")}</div>`;
 }
 body.querySelectorAll("[data-essay]").forEach(b=>b.addEventListener("click",()=>{essayId=b.dataset.essay;renderEssays();body.scrollTop=0;}));
}
function render(id){
 if(id!=="essays"){const bl=document.querySelector("#backBtn [data-t]");bl.textContent=T[lang].home;}
 if(id==="essays")return renderEssays();
 const a=APPS[id][lang];document.getElementById("sheetTitle").textContent=a.t;body.innerHTML=a.h;
 const pb=document.getElementById("pourBtn");
 if(pb)pb.addEventListener("click",()=>{const box=document.getElementById("pourBox");const on=box.classList.toggle("poured");pb.textContent=on?pb.dataset.b:pb.dataset.a;});
}
function openApp(id){
 if(!APPS[id])return;current=id;render(id);body.scrollTop=0;
 sheet.classList.add("open");sheet.setAttribute("aria-hidden","false");
 setTimeout(()=>document.getElementById("backBtn").focus({preventScroll:true}),300);
}
function closeApp(silent){
 if(!current)return;essayId=null;const id=current;current=null;
 sheet.classList.remove("open");sheet.setAttribute("aria-hidden","true");
 if(!silent){const b=document.querySelector(`.grid [data-app="${id}"]`);b&&b.focus({preventScroll:true});}
}
document.querySelectorAll("[data-app]").forEach(b=>b.addEventListener("click",()=>openApp(b.dataset.app)));
document.getElementById("backBtn").addEventListener("click",()=>{if(current==="essays"&&essayId){essayId=null;renderEssays();body.scrollTop=0;}else closeApp();});
document.getElementById("homebarBtn").addEventListener("click",()=>closeApp());

/* boot */
applyLang();
requestAnimationFrame(paint);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(paint);
const h=(location.hash||"").slice(1);
if(APPS[h]){unlock();openApp(h);}
else if(ESSAYS.some(e=>e.id===h)){unlock();essayId=h;openApp("essays");}
})();
</script>

</body>
</html>
